<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brightspeed Workflow Intelligence Platform</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div class="title">
        Brightspeed Workflow Intelligence Platform
    </div>

    <div class="subtitle">
        Historical Workflow Analysis & Task Prediction Engine
    </div>

</header>

<div class="main-container">

    <div class="workflow-card">

        <h2>Workflow Selection</h2>

        <div id="filters" class="filters-grid"></div>

    </div>

    <div class="summary-grid">

        <div class="summary-card">
            <div class="summary-label">Workflow Population</div>
            <div id="population" class="summary-value">0</div>
        </div>

        <div class="summary-card mandatory-card">
            <div class="summary-label">Mandatory Tasks</div>
            <div id="mandatoryCount" class="summary-value">0</div>
        </div>

        <div class="summary-card expected-card">
            <div class="summary-label">Expected Tasks</div>
            <div id="expectedCount" class="summary-value">0</div>
        </div>

        <div class="summary-card optional-card">
            <div class="summary-label">Optional Tasks</div>
            <div id="optionalCount" class="summary-value">0</div>
        </div>

    </div>

    <div id="workflowSummary" class="workflow-summary"></div>

    <div class="task-card">

        <div class="task-header">

            <h2>Workflow Tasks</h2>

            <input
                type="text"
                id="taskSearch"
                placeholder="Search Tasks..."
            >

        </div>

        <table>

            <thead>

                <tr>
                    <th>Task Name</th>
                    <th>Frequency</th>
                    <th>Classification</th>
                </tr>

            </thead>

            <tbody id="taskTable"></tbody>

        </table>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
